name: Build and Deploy Avalon Site

on:
  push:
    paths:
      - 'source.html'   # only triggers when you edit source.html
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build script
        run: python3 build.py

      - name: Commit and push built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html research.html about.html contact.html
          git diff --cached --quiet || git commit -m "Auto-build: split source.html into pages"
          git push
